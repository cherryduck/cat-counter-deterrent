# Synology Container Manager project: Mosquitto + Home Assistant
# Project folder on the NAS: /volume1/docker/catguard
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host          # UI on http://192.168.1.119:8123
    environment:
      - TZ=Europe/London
    volumes:
      - ./homeassistant:/config
    depends_on:
      - mosquitto
