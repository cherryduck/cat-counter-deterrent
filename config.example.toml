# catguard configuration (copy to config.toml and edit)

[capture]
source = "kinect"        # or a recorded session dir for testing
fps = 15.0

[depth]
min_height_mm = 60       # ignore crumbs / depth noise
max_height_mm = 600
min_area_m2 = 0.015      # top-down cat area range (tune from replay output)
max_area_m2 = 0.30
min_inside_roi = 0.85    # people leaning in spill outside the counter -> rejected
absorb_after_s = 180     # forget a non-cat object left on the counter after 3 min

[detector]
model = "models/yolov8n.onnx"
cat_conf = 0.35
min_brightness = 40      # below = dark -> depth-only
night_mode = "depth_only"

[decision]
persist_hits = 3
persist_window = 5
cooldown_s = 45
max_per_hour = 20

[audio]
device = "default"       # set by setup to the USB adapter, e.g. "plughw:CARD=Device,DEV=0"
sounds_dir = "sounds"
volume = 1.0

[mqtt]
enabled = true
host = "192.168.1.119"
port = 1883
username = "catguard"
password = ""            # filled in during NAS setup
base_topic = "catguard"

[storage]
events_dir = "/mnt/catcam"
fallback_dir = "~/catguard-events"
calibration_dir = "calibration"
retention_days = 30
